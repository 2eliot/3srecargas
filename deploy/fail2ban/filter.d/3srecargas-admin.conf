[Definition]
# El journal escribe: "... ADMIN_LOGIN_FAIL ip=1.2.3.4 identifier_matches=0 ua=..."
# Se captura IPv4 e IPv6 con un grupo propio; <HOST> no siempre acepta IPv6 y
# la IP de client_ip() puede venir agrupada por /64 (2001:db8::).
failregex = ADMIN_LOGIN_FAIL ip=(?P<ip>[0-9a-fA-F:.]+)
            ADMIN_2FA_FAIL ip=(?P<ip>[0-9a-fA-F:.]+)
            ADMIN_LOGIN_BLOCK ip=(?P<ip>[0-9a-fA-F:.]+)
ignoreregex =
