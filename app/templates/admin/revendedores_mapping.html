{% extends "admin/base.html" %}
{% block title %}Mapeo Revendedores{% endblock %}
{% block page_title %}Mapeo Revendedores{% endblock %}

{% block content %}
<div style="max-width:900px;">
  <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; align-items:center;">
    <button id="btn-rev-sync" class="btn btn-primary" style="padding:8px 18px; border-radius:8px; background:#6366f1; color:#fff; border:none; cursor:pointer; font-weight:500;">
      Sincronizar Catálogo
    </button>
    <button id="btn-rev-refresh" style="padding:8px 18px; border-radius:8px; background:#334155; color:#e2e8f0; border:none; cursor:pointer; font-weight:500;">
      Refrescar
    </button>
  </div>

  <!-- Paso 1: juego -->
  <div style="margin-bottom:16px;">
    <label style="display:block; font-size:12px; color:#94a3b8; margin-bottom:6px;">1. Elige el juego</label>
    <select id="rev-game-select" class="form-control" style="width:100%; max-width:400px; padding:10px 12px; border-radius:8px; border:1px solid #334155; background:#1e293b; color:#e2e8f0;">
      <option value="">Selecciona un juego…</option>
    </select>
  </div>

  <!-- Paso 2: paquete -->
  <div id="rev-package-wrap" style="margin-bottom:20px; display:none;">
    <label style="display:block; font-size:12px; color:#94a3b8; margin-bottom:6px;">2. Elige el paquete</label>
    <select id="rev-package-select" class="form-control" style="width:100%; max-width:400px; padding:10px 12px; border-radius:8px; border:1px solid #334155; background:#1e293b; color:#e2e8f0;">
      <option value="">Selecciona un paquete…</option>
    </select>
  </div>

  <!-- Paso 3: items del paquete elegido -->
  <div id="rev-items-wrap" style="display:none; padding:16px; background:#1e293b; border-radius:10px; border:1px solid #334155;">
    <div style="font-weight:600; color:#e2e8f0; margin-bottom:2px;" id="rev-items-title">—</div>
    <div style="font-size:12px; color:#94a3b8; margin-bottom:14px;" id="rev-items-subtitle">—</div>

    <div id="rev-items-header" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px;">
      <span style="flex:1; min-width:160px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:#94a3b8;">Item</span>
      <span style="flex:1; min-width:180px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:#94a3b8;">Paquete</span>
      <span style="width:70px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:#94a3b8; text-align:center;">Cantidad</span>
      <span style="width:34px;"></span>
    </div>
    <div id="rev-items-list" style="display:flex; flex-direction:column; gap:10px;"></div>

    <button id="btn-rev-add-item" type="button" style="margin-top:12px; padding:7px 14px; border-radius:8px; background:#334155; color:#e2e8f0; border:1px dashed #64748b; cursor:pointer; font-weight:600; font-size:13px;">
      + Agregar item
    </button>

    <label style="display:flex; align-items:center; gap:8px; font-size:13px; color:#cbd5e1; margin-top:18px;">
      <input type="checkbox" id="rev-auto-chk">
      Recarga automática secuencial
    </label>

    <button id="btn-rev-save" style="margin-top:16px; padding:9px 20px; border-radius:8px; background:#22c55e; color:#fff; border:none; cursor:pointer; font-weight:600;">
      Guardar mapeo de este paquete
    </button>
  </div>
</div>

<div id="toast-container" style="position:fixed; top:20px; right:20px; z-index:9999;"></div>
{% endblock %}

{% block extra_js %}
<script>
(function() {
  const gameSelect = document.getElementById('rev-game-select');
  const packageWrap = document.getElementById('rev-package-wrap');
  const packageSelect = document.getElementById('rev-package-select');
  const itemsWrap = document.getElementById('rev-items-wrap');
  const itemsTitle = document.getElementById('rev-items-title');
  const itemsSubtitle = document.getElementById('rev-items-subtitle');
  const itemsList = document.getElementById('rev-items-list');
  const btnAddItem = document.getElementById('btn-rev-add-item');
  const autoChk = document.getElementById('rev-auto-chk');
  const btnSync = document.getElementById('btn-rev-sync');
  const btnSave = document.getElementById('btn-rev-save');
  const btnRefresh = document.getElementById('btn-rev-refresh');

  let mappingData = null;    // última respuesta de /mapping-data
  let remoteGroups = {};     // { "Free Fire": [{catalog_id, remote_package_name, price}, ...] }
  let catalogToGroup = {};   // catalog_id -> nombre del grupo, para preseleccionar al editar

  function toast(msg) {
    const d = document.createElement('div');
    d.style.cssText = 'background:#1e293b; color:#e2e8f0; padding:12px 20px; border-radius:10px; margin-bottom:8px; box-shadow:0 4px 12px rgba(0,0,0,.4); max-width:420px; white-space:pre-wrap; font-size:13px; border:1px solid #334155;';
    d.textContent = msg;
    document.getElementById('toast-container').appendChild(d);
    setTimeout(() => d.remove(), 8000);
  }

  function mappingFor(pkgId) {
    return (mappingData.mappings || []).find(m => String(m.store_package_id) === String(pkgId));
  }

  /* Trae TODO el catálogo (sin filtrar por juego): un paquete puede
     armarse con items de otro juego si hace falta, así que no conviene
     limitar las opciones de la fila al juego elegido en el paso 1. */
  async function fetchMappingData() {
    const res = await fetch('/admin/revendedores/mapping-data');
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Error cargando datos');
    mappingData = data;
    buildRemoteOptions(data.remote_catalog || []);
    renderGames(data.games || []);
  }

  function buildRemoteOptions(remoteCatalog) {
    remoteGroups = {};
    catalogToGroup = {};
    remoteCatalog.forEach(rc => {
      const gName = (rc.remote_product_name || '').trim() || 'Otro';
      if (!remoteGroups[gName]) remoteGroups[gName] = [];
      remoteGroups[gName].push(rc);
      catalogToGroup[rc.catalog_id] = gName;
    });
  }

  function renderGames(games) {
    const current = gameSelect.value;
    gameSelect.innerHTML = '<option value="">Selecciona un juego…</option>';
    games.forEach(g => {
      const opt = document.createElement('option');
      opt.value = g.id;
      opt.textContent = g.name;
      if (String(g.id) === String(current)) opt.selected = true;
      gameSelect.appendChild(opt);
    });
  }

  function renderPackages(gameId) {
    packageSelect.innerHTML = '<option value="">Selecciona un paquete…</option>';
    const packages = (mappingData.store_packages || []).filter(p => String(p.game_id) === String(gameId));
    packages.forEach(p => {
      const mapped = mappingFor(p.id);
      const tag = mapped && mapped.items && mapped.items.length ? ' ✓ mapeado' : '';
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = `${p.name} — ID ${p.id} · USD ${Number(p.price).toFixed(2)}${tag}`;
      packageSelect.appendChild(opt);
    });
    packageWrap.style.display = packages.length ? '' : 'none';
    itemsWrap.style.display = 'none';
    packageSelect.value = '';
  }

  /* Llena el segundo select (paquete) con las opciones del grupo elegido
     en el primero (nombre del item / juego remoto). */
  function fillPackageSelect(packageSel, groupName, selectedCatalogId) {
    const opciones = remoteGroups[groupName] || [];
    packageSel.innerHTML = '<option value="">Elige el paquete…</option>';
    opciones.forEach(rc => {
      const pkgName = (rc.remote_package_name || '').trim() || ('Paquete ' + rc.remote_package_id);
      const priceTag = rc.price != null ? ` ($${Number(rc.price).toFixed(2)})` : '';
      const opt = document.createElement('option');
      opt.value = rc.catalog_id;
      opt.textContent = `${pkgName}${priceTag}`;
      packageSel.appendChild(opt);
    });
    packageSel.disabled = !opciones.length;
    if (selectedCatalogId) packageSel.value = selectedCatalogId;
  }

  function addItemRow(catalogId, quantity) {
    const row = document.createElement('div');
    row.className = 'rev-item-row';
    row.style.cssText = 'display:flex; gap:8px; align-items:center; flex-wrap:wrap;';
    row.innerHTML = `
      <select class="rev-item-name" style="flex:1; min-width:160px; padding:8px 10px; border-radius:6px; border:1px solid #475569; background:#0f172a; color:#e2e8f0; font-size:13px;">
        <option value="">Elige el item…</option>
        ${Object.keys(remoteGroups).sort().map(g => `<option value="${g}">${g}</option>`).join('')}
      </select>
      <select class="rev-item-package" style="flex:1; min-width:180px; padding:8px 10px; border-radius:6px; border:1px solid #475569; background:#0f172a; color:#e2e8f0; font-size:13px;" disabled>
        <option value="">Elige el paquete…</option>
      </select>
      <input type="number" class="rev-item-qty" min="1" value="${quantity || 1}" title="Cantidad"
             style="width:70px; padding:8px 10px; border-radius:6px; border:1px solid #475569; background:#0f172a; color:#e2e8f0; font-size:13px; text-align:center;">
      <button type="button" class="rev-item-remove" title="Quitar item"
              style="padding:7px 10px; border-radius:6px; border:1px solid #475569; background:#1e293b; color:#fca5a5; cursor:pointer; font-weight:700;">×</button>
    `;
    const nameSel = row.querySelector('.rev-item-name');
    const packageSel = row.querySelector('.rev-item-package');

    nameSel.addEventListener('change', () => fillPackageSelect(packageSel, nameSel.value, ''));
    row.querySelector('.rev-item-remove').addEventListener('click', () => row.remove());

    if (catalogId && catalogToGroup[catalogId]) {
      const grupo = catalogToGroup[catalogId];
      nameSel.value = grupo;
      fillPackageSelect(packageSel, grupo, catalogId);
    }

    itemsList.appendChild(row);
  }

  function renderItemsEditor(pkgId) {
    const pkg = (mappingData.store_packages || []).find(p => String(p.id) === String(pkgId));
    if (!pkg) { itemsWrap.style.display = 'none'; return; }

    const mapping = mappingFor(pkgId);
    itemsTitle.textContent = `${pkg.game_name} — ${pkg.name}`;
    itemsSubtitle.textContent = `ID ${pkg.id} · USD ${Number(pkg.price).toFixed(2)}`;
    autoChk.checked = !!(mapping && mapping.auto_enabled);

    itemsList.innerHTML = '';
    const items = (mapping && mapping.items && mapping.items.length) ? mapping.items : [];
    if (items.length) {
      items.forEach(it => addItemRow(it.catalog_id, it.quantity));
    } else {
      addItemRow('', 1);
    }
    itemsWrap.style.display = '';
  }

  async function syncCatalog() {
    const res = await fetch('/admin/revendedores/sync', { method: 'POST' });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) throw new Error(data.error || 'No se pudo sincronizar');
    return data;
  }

  async function savePackageMapping() {
    const pkgId = parseInt(packageSelect.value, 10);
    if (!pkgId) throw new Error('Elige un paquete primero.');

    const items = [];
    itemsList.querySelectorAll('.rev-item-row').forEach(row => {
      const catalogId = row.querySelector('.rev-item-package').value;
      const qty = parseInt(row.querySelector('.rev-item-qty').value, 10) || 1;
      if (catalogId) items.push({ catalog_id: catalogId, quantity: qty });
    });

    const res = await fetch('/admin/revendedores/mappings/bulk', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        entries: [{
          store_package_id: pkgId,
          items,
          auto_enabled: !!autoChk.checked,
        }],
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) throw new Error(data.error || 'No se pudo guardar');
    return data;
  }

  // Eventos
  gameSelect.addEventListener('change', () => renderPackages(gameSelect.value));
  packageSelect.addEventListener('change', () => renderItemsEditor(packageSelect.value));
  btnAddItem.addEventListener('click', () => addItemRow('', 1));

  btnRefresh.addEventListener('click', () => {
    const g = gameSelect.value, p = packageSelect.value;
    fetchMappingData()
      .then(() => {
        if (g) { gameSelect.value = g; renderPackages(g); }
        if (p) { packageSelect.value = p; renderItemsEditor(p); }
      })
      .catch(e => toast(e.message));
  });

  btnSync.addEventListener('click', async () => {
    try {
      btnSync.disabled = true;
      const data = await syncCatalog();
      const gamesInfo = data.games ? Object.entries(data.games).map(([g, c]) => `${g}: ${c}`).join('\n') : '';
      toast(`Sincronizado: ${data.created || 0} nuevos, ${data.updated || 0} actualizados, ${data.active_in_db || 0} activos en DB\n${gamesInfo}`);
      const g = gameSelect.value, p = packageSelect.value;
      await fetchMappingData();
      if (g) { gameSelect.value = g; renderPackages(g); }
      if (p) { packageSelect.value = p; renderItemsEditor(p); }
    } catch (e) {
      toast(e.message || 'Error al sincronizar');
    } finally {
      btnSync.disabled = false;
    }
  });

  btnSave.addEventListener('click', async () => {
    try {
      btnSave.disabled = true;
      await savePackageMapping();
      toast('Mapeo guardado');
      const g = gameSelect.value, p = packageSelect.value;
      await fetchMappingData();
      gameSelect.value = g; renderPackages(g);
      packageSelect.value = p; renderItemsEditor(p);
    } catch (e) {
      toast(e.message || 'Error al guardar');
    } finally {
      btnSave.disabled = false;
    }
  });

  // Init
  fetchMappingData().catch(e => toast(e.message));
})();
</script>
{% endblock %}
