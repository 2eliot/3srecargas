{% extends 'admin/base.html' %}
{% block title %}Soporte{% endblock %}

{% block extra_css %}
<style>
.sup-empty-pane{
    height:100vh;display:grid;place-items:center;padding:24px;text-align:center;color:var(--text-muted);
    background:radial-gradient(circle at 50% 38%, rgba(139,92,246,.10), transparent 55%);
}
.sup-empty-pane .ico{font-size:3.2rem;margin-bottom:10px}
.sup-empty-pane h3{color:var(--text-primary);font-size:1.05rem;margin-bottom:6px}
.sup-empty-pane p{font-size:.86rem;max-width:300px;line-height:1.5}
</style>
{% endblock %}

{% block content %}
<div class="sup-empty-pane">
    <div>
        <div class="ico">💬</div>
        <h3>Elige un chat</h3>
        <p>Toca una conversación de la bandeja para verla aquí. Los chats nuevos aparecen solos, sin recargar la página.</p>
    </div>
</div>
{% endblock %}
